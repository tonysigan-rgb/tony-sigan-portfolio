<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="The Deadline — official teaser" />
    <meta property="og:image" content="https://tonysigan-rgb.github.io/tony-sigan-portfolio/assets/projects/the-deadline-poster.jpg" />
    <title>The Deadline — Teaser · pluffy minis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <style>
      :root { --red:#c10a0a; --red2:#e01b1b; --mono:"DM Mono",monospace; --display:"DM Sans",Arial,sans-serif; }
      * { box-sizing:border-box; }
      html,body { margin:0; height:100%; background:#000; color:#fff; font-family:var(--display); overflow:hidden; -webkit-tap-highlight-color:transparent; }
      button, a { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; text-decoration:none; }
      .stage { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(circle at 50% 40%, #1a0a0a, #000 70%); }
      .player { position:relative; height:100%; width:min(100%, 100dvh * 9 / 16); overflow:hidden; background:#000; }
      @media (max-width:600px) { .player { width:100%; } }
      .poster { position:absolute; inset:0; background:url("assets/projects/the-deadline-poster.jpg") center/cover; transition:opacity .4s; }
      .player.started .poster { opacity:0; pointer-events:none; }
      #yt, .player iframe { position:absolute; left:0; top:0; width:100%; height:100%; border:0; pointer-events:none; }
      .tap { position:absolute; inset:0; z-index:2; }
      .ui { position:absolute; inset:0; z-index:3; pointer-events:none; transition:opacity .3s; }
      .ui a, .ui button { pointer-events:auto; }
      .player.playing:not(.reveal) .ui { opacity:0; }
      .player.playing:not(.reveal) .ui * { pointer-events:none !important; }
      .shade-t { position:absolute; inset:0 0 auto; height:7rem; background:linear-gradient(rgba(0,0,0,.6),transparent); }
      .shade-b { position:absolute; inset:auto 0 0; height:15rem; background:linear-gradient(transparent,rgba(0,0,0,.85)); }
      .bar { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:.55rem; padding:max(.85rem, env(safe-area-inset-top)) .9rem .8rem; }
      .in-app .bar { padding-left:3.7rem; }
      .badge { padding:.3rem .5rem; border-radius:.35rem; background:#111; border:1px solid var(--red2); font:.62rem var(--mono); letter-spacing:.04em; }
      .series { font-weight:600; font-size:.85rem; }
      .center { position:absolute; left:50%; top:50%; width:4.6rem; height:4.6rem; margin:-2.3rem 0 0 -2.3rem; display:grid; place-items:center; border-radius:50%; background:rgba(224,27,27,.92); box-shadow:0 0 0 .5rem rgba(224,27,27,.25); }
      .player.playing .center { background:rgba(0,0,0,.5); box-shadow:none; }
      .center svg { width:1.8rem; height:1.8rem; }
      .meta { position:absolute; left:0; right:0; bottom:1.8rem; padding:0 1rem; }
      .player:not(.started) .meta small, .player:not(.started) .meta h1, .player:not(.started) .meta p { display:none; }
      .meta small { font:.6rem var(--mono); color:var(--red2); letter-spacing:.06em; }
      .meta h1 { margin:.3rem 0 .2rem; font-size:1.7rem; letter-spacing:-.04em; line-height:1; }
      .meta p { margin:.35rem 0 0; font-size:.88rem; line-height:1.35; color:rgba(255,255,255,.85); }
      .meta .ctas { display:flex; gap:.5rem; margin-top:.8rem; flex-wrap:wrap; }
      .pill { display:inline-flex; align-items:center; gap:.4rem; padding:.6rem .9rem; border-radius:2rem; background:var(--red2); font:700 .78rem var(--display); }
      .pill.ghost { background:rgba(255,255,255,.14); font-weight:600; }
      .progress { position:absolute; left:0; right:0; bottom:0; height:1rem; display:flex; align-items:flex-end; pointer-events:auto; }
      .progress span { width:100%; height:3px; background:rgba(255,255,255,.22); }
      .progress i { display:block; height:100%; width:0; background:var(--red2); }
      .end { position:absolute; inset:0; z-index:4; display:none; flex-direction:column; align-items:center; justify-content:center; gap:.8rem; text-align:center; padding:2rem; background:rgba(0,0,0,.78); }
      .player.ended .end { display:flex; }
      .end small { font:.65rem var(--mono); color:rgba(255,255,255,.65); letter-spacing:.05em; }
      .end b { font-size:2rem; letter-spacing:-.04em; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="player" id="P">
        <div class="poster"></div>
        <div id="yt"></div>
        <div class="tap" id="tap"></div>
        <div class="ui">
          <div class="shade-t"></div><div class="shade-b"></div>
          <div class="bar"><span class="badge">TEASER</span><span class="series">The Deadline</span></div>
          <button class="center" id="center" aria-label="Play teaser"><svg id="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
          <div class="meta">
            <small>◷ COMING SOON · PLUFFY MINIS ORIGINAL</small>
            <h1>The Deadline</h1>
            <p>One office. One night. One deadline neither of them can afford to miss.</p>
            <div class="ctas">
              <a class="pill" id="sub" href="#" target="_blank" rel="noreferrer">▶ Subscribe for updates</a>
              <a class="pill ghost" href="pluffyminis.html" id="more">All series</a>
            </div>
          </div>
          <div class="progress" id="progress"><span><i id="fill"></i></span></div>
        </div>
        <div class="end">
          <small>THE DEADLINE · COMING SOON</small>
          <b>See you soon.</b>
          <a class="pill" id="sub2" href="#" target="_blank" rel="noreferrer">▶ Subscribe so you don't miss it</a>
          <button class="pill ghost" id="replay">↺ Watch again</button>
        </div>
      </div>
    </div>

    <script src="pluffy-data.js?v=20261105e"></script>
    <script>
      const TEASER = "NqRSRWf0IjQ";
      const $ = (id) => document.getElementById(id);
      const P = $("P");
      const inApp = /[?&]app=1/.test(location.search);
      if (inApp) { document.documentElement.classList.add("in-app"); $("more").style.display = "none"; }
      const SUB = (window.PLUFFY && window.PLUFFY.subscribe) || "https://www.youtube.com/@itsmetslFilms?sub_confirmation=1";
      $("sub").href = $("sub2").href = SUB;

      const PLAY = '<path d="M7 4.5v15l12-7.5z"/>';
      const PAUSE = '<rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/>';
      let yt = null, ready = false, hideT;

      function fit() {
        const f = P.querySelector("iframe"); if (!f) return;
        const W = P.clientWidth, H = P.clientHeight;
        let vw, vh;
        if (W / H > 9 / 16) { vw = W; vh = W * 16 / 9; } else { vh = H; vw = H * 9 / 16; }
        const crop = Math.round(Math.max(64, vh * 0.1));
        Object.assign(f.style, { width: vw + "px", height: vh + crop * 2 + "px", left: (W - vw) / 2 + "px", top: (H - vh) / 2 - crop + "px" });
      }
      addEventListener("resize", fit);

      function reveal() { P.classList.add("reveal"); clearTimeout(hideT); hideT = setTimeout(() => P.classList.remove("reveal"), 2600); }
      function toggle() {
        if (!ready) return;
        P.classList.remove("ended");
        yt.getPlayerState() === YT.PlayerState.PLAYING ? yt.pauseVideo() : yt.playVideo();
      }
      $("center").onclick = toggle;
      $("tap").onclick = () => { if (!P.classList.contains("started")) return toggle(); P.classList.contains("playing") && !P.classList.contains("reveal") ? reveal() : toggle(); };
      $("replay").onclick = () => { P.classList.remove("ended"); yt.seekTo(0, true); yt.playVideo(); };
      $("progress").onclick = (e) => { if (!ready) return; const r = $("progress").getBoundingClientRect(); yt.seekTo(((e.clientX - r.left) / r.width) * yt.getDuration(), true); reveal(); };

      window.onYouTubeIframeAPIReady = () => {
        yt = new YT.Player("yt", {
          videoId: TEASER,
          playerVars: { playsinline: 1, controls: 0, rel: 0, modestbranding: 1, fs: 0, iv_load_policy: 3, disablekb: 1 },
          events: {
            onReady: () => { ready = true; fit(); yt.playVideo(); },
            onStateChange: (e) => {
              const S = YT.PlayerState;
              if (e.data === S.PLAYING) { P.classList.add("started", "playing"); $("ic").innerHTML = PAUSE; reveal(); }
              if (e.data === S.PAUSED) { P.classList.remove("playing"); $("ic").innerHTML = PLAY; }
              if (e.data === S.ENDED) { P.classList.remove("playing"); P.classList.add("ended"); $("ic").innerHTML = PLAY; }
            },
          },
        });
      };
      setInterval(() => { if (ready && yt.getDuration) { const d = yt.getDuration(); if (d) $("fill").style.width = (yt.getCurrentTime() / d) * 100 + "%"; } }, 250);
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
    </script>
  </body>
</html>
