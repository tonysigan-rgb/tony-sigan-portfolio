name: Auto subtitles + thumbnails (new episodes on Cloudflare)

# Every hour: if a new ps-epNN.mp4 is in the Cloudflare folder and has no subtitles yet,
# transcribe it (English, word-timed) and publish subs/ps-epNN.en.vtt.
# The Malay/Indonesian, Mandarin and Korean lines are added afterwards by a scheduled Claude task.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      remake_thumbnails:
        description: "Set to 1 to remake every episode thumbnail"
        required: false
        default: ""
      test_episode:
        description: "Test only: transcribe this episode number and print it (publishes nothing)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-subtitles
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Thumbnails for new episodes
        if: github.event.inputs.test_episode == ''
        env:
          FORCE: ${{ github.event.inputs.remake_thumbnails }}
        run: |
          python -m pip install --quiet av pillow numpy
          python scripts/auto_thumbs.py
      - name: Anything new to transcribe?
        id: check
        env:
          TEST_EPISODE: ${{ github.event.inputs.test_episode }}
        run: |
          if [ -n "$TEST_EPISODE" ]; then echo "new=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          python - <<'EOF'
          import os, re, urllib.request
          js = open("pluffy-data.js", encoding="utf-8").read()
          base = re.search(r'videoBase:\s*"([^"]+)"', js).group(1).rstrip("/") + "/"
          pat = re.search(r'videoPattern:\s*"([^"]+)"', js).group(1)
          total = len(re.findall(r'\{\s*title:\s*"Episode \d+"', js))
          new = []
          for n in range(1, total + 1):
              if os.path.exists(f"subs/data/ps-ep{n:02d}.json"):
                  continue
              try:
                  req = urllib.request.Request(base + pat.replace("{nn}", f"{n:02d}"), method="HEAD", headers={"User-Agent": "Mozilla/5.0 (pluffy-auto-subs)"})
                  if urllib.request.urlopen(req, timeout=30).status == 200:
                      new.append(n)
              except Exception:
                  pass
          print("new episodes:", new)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"new={'yes' if new else ''}\n")
          EOF
      - name: Keep the Whisper model between runs
        if: steps.check.outputs.new == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - name: Install Whisper
        if: steps.check.outputs.new == 'yes'
        run: python -m pip install --quiet faster-whisper
      - name: Transcribe new episodes
        if: steps.check.outputs.new == 'yes'
        env:
          TEST_EPISODE: ${{ github.event.inputs.test_episode }}
        run: python scripts/auto_subs.py
      - name: Publish subtitles and thumbnails
        if: github.event.inputs.test_episode == ''
        run: |
          if [ -z "$(git status --porcelain subs assets/thumbs)" ]; then exit 0; fi
          v=$(date -u +%Y%m%d%H%M)
          sed -i -E "s/subsVersion: \"[^\"]*\"/subsVersion: \"$v\"/" pluffy-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subs assets/thumbs pluffy-data.js
          git commit -m "Auto: subtitles / thumbnails for new episode(s)"
          git pull --rebase --quiet origin main
          git push
