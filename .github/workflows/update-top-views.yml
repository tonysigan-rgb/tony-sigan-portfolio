name: Refresh YouTube top views

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install YouTube reader
        run: python -m pip install --upgrade yt-dlp
      - name: Refresh public view counts
        run: python scripts/update_top_views.py
      - name: Save refreshed rankings
        run: |
          if git diff --quiet -- top-views.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-views.json
          git commit -m "Refresh YouTube top views"
          git push
